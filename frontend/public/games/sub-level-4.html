<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>THE SUB-LEVEL 4 INCIDENT</title>
<style>
:root{color-scheme:dark;font-family:"Courier New",monospace;background:#050505;color:#33ff33}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#050505}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden}
#game-container{width:min(760px,100%);height:min(620px,calc(100vh - 20px));min-height:360px;background:#000;border:2px solid #22aa22;box-shadow:0 0 20px #00c80033;padding:clamp(10px,2.5vw,20px);display:flex;flex-direction:column}
#hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-bottom:1px solid #22aa22;padding-bottom:10px;margin-bottom:10px;font-size:clamp(10px,1.6vw,13px)}
#output{flex:1;min-height:0;overflow-y:auto;margin-bottom:12px;padding-right:8px;font-size:clamp(12px,1.8vw,15px);line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
#output p{margin:0 0 10px}
#input-area{display:flex;gap:10px;border-top:1px solid #22aa22;padding-top:10px;flex-shrink:0}
#input-prompt{margin-right:0}
#user-input{min-width:0;flex:1;background:transparent;border:0;color:#33ff33;font:inherit;font-size:16px;outline:none}
.warning{color:#ff5555}.system{color:#888}.success{color:#ffff33}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#000}::-webkit-scrollbar-thumb{background:#22aa22}
@media(max-width:480px){body{padding:0}#game-container{height:100dvh;min-height:320px;border-left:0;border-right:0;padding:10px}#hud{gap:5px 10px}#output{font-size:13px}}
</style>
</head>
<body>
<main id="game-container" aria-label="The Sub-Level 4 Incident text adventure">
<div id="hud"><div>LOCATION: <span id="hud-location">Loading...</span></div><div>BATTERY: <span id="hud-battery">100%</span></div><div>SANITY: <span id="hud-sanity">100%</span></div><div>KEYS: <span id="hud-keys">0/3</span></div></div>
<div id="output" aria-live="polite"></div>
<form id="input-area"><label id="input-prompt" for="user-input">&gt;</label><input id="user-input" type="text" autofocus autocomplete="off" spellcheck="false" aria-label="Enter a game command"></form>
</main>
<script>
(() => {
const outputDiv=document.getElementById("output"), userInput=document.getElementById("user-input");
const state={currentRoom:"corridor",battery:100,sanity:100,keysFound:0,flashlightOn:true,creatureDistance:4,gameOver:false};
const rooms={
corridor:{name:"Main Laboratory Corridor",desc:"A long, flickering hallway. Thick blast doors seal the exit at the far end. Doors lead to the [Server Room], [Bio-Lab], and [Security Office].",commands:["server","bio","security","exit"]},
server:{name:"Server Room / Databank",desc:"The servers hum weakly, coated in frost. Wires hang like vines from the ceiling. You see a glinting object on a console desk. Type [search] to investigate, or [corridor] to head back.",hasKey:true,commands:["search","corridor"]},
bio:{name:"Biological Testing Suite",desc:"Smashed glass containment tanks litter the floor. Green synthetic fluid pools near your boots. A dark locker stands in the corner. Type [search], [hide], or [corridor].",hasKey:true,commands:["search","hide","corridor"]},
security:{name:"Security Station",desc:"CCTV monitors blink through static. A drawer sits half-open under the main desk. Type [search] to inspect it, or [corridor] to leave.",hasKey:true,commands:["search","corridor"]}
};
function log(text,cls=""){const p=document.createElement("p");if(cls)p.className=cls;p.textContent=text;outputDiv.appendChild(p);outputDiv.scrollTop=outputDiv.scrollHeight}
function updateHUD(){document.getElementById("hud-location").textContent=rooms[state.currentRoom].name.toUpperCase();document.getElementById("hud-battery").textContent=state.battery+"%";document.getElementById("hud-sanity").textContent=state.sanity+"%";document.getElementById("hud-keys").textContent=state.keysFound+"/3"}
function endGame(){state.gameOver=true;userInput.disabled=true;log("[Refresh this game to try again]","system")}
function look(){log("\n"+rooms[state.currentRoom].desc)}
function tick(){if(state.gameOver)return;
if(state.flashlightOn){state.battery=Math.max(0,state.battery-2);if(!state.battery){state.flashlightOn=false;log("Your flashlight sputters and dies. You are plunged into absolute darkness.","warning")}}
if(!state.flashlightOn){state.sanity=Math.max(0,state.sanity-8);log("The dark feels heavy. You hear breathing behind you. Your sanity is slipping.","warning")}else if(Math.random()>.6)state.sanity=Math.max(0,state.sanity-1);
if(Math.random()>.4){if(state.flashlightOn){state.creatureDistance--;log("Heavy, scraping footsteps echo closer down the metal vents...","warning")}else if(state.creatureDistance<4){state.creatureDistance++;log("The heavy footsteps seem to fade back into the shadows.","system")}}
if(state.sanity<=0){log("\nYou lose your grip on reality. GAME OVER.","warning");endGame()}else if(state.creatureDistance<=0){log("\nSomething massive drops from the ceiling behind you. GAME OVER.","warning");endGame()}
updateHUD()}
function handleCommand(raw){const cmd=raw.toLowerCase().trim();if(!cmd)return;log("\n> "+cmd,"system");if(state.gameOver)return;
if(cmd==="help"){log("Actions: look, light (toggle flashlight), status. Use the room names shown in brackets to move.");return}
if(cmd==="light"){if(state.battery<=0){log("The battery is dead. The switch does nothing.","warning");return}state.flashlightOn=!state.flashlightOn;log("You click the flashlight "+(state.flashlightOn?"ON.":"OFF, hiding your presence."));updateHUD();return}
if(cmd==="status"){log("Battery "+state.battery+"% | Sanity "+state.sanity+"% | Keycards "+state.keysFound+"/3");return}
if(cmd==="look"){look();return}
const current=rooms[state.currentRoom];
if(cmd==="corridor"&&current.commands.includes("corridor")){state.currentRoom="corridor";look();tick();return}
if(state.currentRoom==="corridor"){
if(["server","bio","security"].includes(cmd)){state.currentRoom=cmd;look();tick();return}
if(cmd==="exit"){if(state.keysFound>=3){log("\nThe blast doors slide open. You escape into the morning sun. YOU SURVIVED!","success");endGame()}else log('The security console blinks red: "ACCESS DENIED. THREE KEYCARDS REQUIRED."',"warning");return}
}
if(cmd==="search"&&current.commands.includes("search")){if(current.hasKey){state.keysFound++;current.hasKey=false;log("You found an encrypted keycard! It matches the main blast door console.","success")}else log("You search the room but find nothing else of use.");tick();return}
if(cmd==="hide"&&state.currentRoom==="bio"){log("You slide into the metal locker and hold your breath.");if(state.creatureDistance<4){state.creatureDistance=4;log("Claws scrape past the locker door, then retreat down the corridor...","system")}if(state.flashlightOn)log("Your flashlight is still on. You should turn it off while hiding.","warning");tick();return}
log("Unknown command or action not possible here. Type [help] if you are stuck.")
}
log("==================================================","success");log("          THE SUB-LEVEL 4 INCIDENT v1.0          ","success");log("==================================================","success");log("Type [help] at any time to view controls.");log("--------------------------------------------------");log("SYSTEM WARNING: Biological anomaly containment breach detected in sectors A through D.");log("Facility lockdown initiated. Use backup terminal consoles to bypass gates.");look();updateHUD();
document.getElementById("input-area").addEventListener("submit",e=>{e.preventDefault();handleCommand(userInput.value);userInput.value="";userInput.focus()});
})();
</script>
</body>
</html>
